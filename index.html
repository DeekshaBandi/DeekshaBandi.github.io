<style>
  :root { --bg:#f5f7fb; --panel:rgba(255,255,255,.92); --panel-solid:#fff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b; --accent:#6366f1; --accent2:#8b5cf6; --code:#f1f5f9; --shadow:0 10px 30px rgba(99,102,241,.12); }

  .file-label { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(99,102,241,.4); transition:transform .15s, box-shadow .15s; white-space:nowrap; }

  #mdToolbar { display:flex; align-items:center; gap:1px; padding:6px 10px; border-bottom:1px solid var(--border); flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; flex-shrink:0; }

  #mdToolbar button:hover { background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); }
    #mdToolbar svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; margin:auto; }
  #mdToolbar i { width:1px; height:16px; background:var(--border); margin:0 3px; flex-shrink:0; }

  #rail::after { content:''; position:absolute; right:3px; top:50%; width:3px; height:40px; margin-top:-20px; border-radius:3px; background:var(--accent); opacity:.7; transition:opacity .2s; }

  #rail .icon-btn { cursor:pointer; }

  #rail .icon-btn:hover { color:var(--ic); background:color-mix(in srgb, var(--ic) 28%, var(--panel-solid)) !important; filter:none; border-color:var(--ic); }
  #rail .icon-btn:disabled { color:var(--ic); background:color-mix(in srgb, var(--ic) 16%, var(--panel-solid)) !important; border-color:color-mix(in srgb, var(--ic) 45%, transparent); }
  #rail .icon-btn { background:transparent !important; border-color:transparent !important; box-shadow:none !important; border-radius:10px; }
  #rail .icon-btn:hover:not(:disabled) { background:color-mix(in srgb, var(--ic) 14%, transparent) !important; }
  #rail .icon-btn:disabled { background:transparent !important; border-color:transparent !important; }

  body.dark #rail .icon-btn[for="fileInput"] { --ic:#5fc0ae; } body.dark #rail #pdfBtn { --ic:#e0788f; } body.dark #rail #pvBtn { --ic:#b58ac4; } body.dark #rail #toggleBtn { --ic:#a0a1a4; }
  #rail #resetBtn { --ic:#7a9a01; } body.dark #rail #resetBtn { --ic:#a8c83c; }
  #rail #copyBtn { --ic:#f29a3a; } #rail #syncBtn { --ic:#003da6; } #rail #clearBtn { --ic:#d62828; } #rail #helpBtn { --ic:#8b3dff; }
  body.dark #rail #copyBtn { --ic:#f5b160; } body.dark #rail #syncBtn { --ic:#6f8fe0; } body.dark #rail #clearBtn { --ic:#ff6b6b; } body.dark #rail #helpBtn { --ic:#b27dff; }
  #syncBtn { position:relative; } #syncBtn[aria-pressed="false"] { opacity:.55; }
  #syncBtn[aria-pressed="false"]::after { content:''; position:absolute; left:9px; right:9px; top:50%; height:2px; border-radius:2px; background:currentColor; transform:rotate(-45deg); }

  /* Preview themes (scoped to the preview pane) */

  body[data-pv="bsw"] { --bg:#f4f4f4; --panel:#ffffff; --panel-solid:#ffffff; --border:#d9dadb; --text:#4a4a4c; --muted:#909194; --code:#eeefef; --accent:#f0a500; --accent2:#f29a3a; --shadow:0 10px 30px rgba(77,77,79,.14); }
  body[data-pv="github"] { --bg:#f6f8fa; --panel:#ffffff; --panel-solid:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#656d76; --code:#f6f8fa; --accent:#0969da; --accent2:#1a7f37; --shadow:0 10px 30px rgba(60,60,60,.12); }
  body[data-pv="paper"] { --bg:#efe5cc; --panel:#f4ecd8; --panel-solid:#fbf5e6; --border:#d9c9a8; --text:#433422; --muted:#7a6a52; --code:#eadfc4; --accent:#b45309; --accent2:#92400e; --shadow:0 10px 30px rgba(60,60,60,.12); font-family:Georgia,'Iowan Old Style','Times New Roman',serif; }
  body[data-pv="solarized"] { --bg:#f5eed8; --panel:#fdf6e3; --panel-solid:#fffaf0; --border:#e4dcc3; --text:#586e75; --muted:#839496; --code:#eee8d5; --accent:#268bd2; --accent2:#2aa198; --shadow:0 10px 30px rgba(60,60,60,.12); }

  body[data-pv="solarizeddark"] { --bg:#00212b; --panel:#073642; --panel-solid:#0b3d4b; --border:#14505f; --text:#93a1a1; --muted:#7f9396; --code:#0b3d4b; --accent:#268bd2; --accent2:#2aa198; --shadow:0 10px 30px rgba(0,0,0,.5); }
  body[data-pv="nord"] { --bg:#242933; --panel:#2e3440; --panel-solid:#3b4252; --border:#434c5e; --text:#d8dee9; --muted:#9aa5b8; --code:#3b4252; --accent:#88c0d0; --accent2:#81a1c1; --shadow:0 10px 30px rgba(0,0,0,.5); }
  body[data-pv="bswdark"] { --bg:#1b1b1d; --panel:#262628; --panel-solid:#303032; --border:#4a4a4c; --text:#eeefef; --muted:#a0a1a4; --code:#303032; --accent:#fbb423; --accent2:#f29a3a; --shadow:0 10px 30px rgba(0,0,0,.5); }
  body[data-pv="dracula"] { --bg:#1e1f29; --panel:#282a36; --panel-solid:#343746; --border:#44475a; --text:#f8f8f2; --muted:#a9acc2; --code:#343746; --accent:#bd93f9; --accent2:#ff79c6; --shadow:0 10px 30px rgba(0,0,0,.5); }
  body[data-pv="tokyo"] { --bg:#13141c; --panel:#1a1b26; --panel-solid:#24283b; --border:#2f334d; --text:#c0caf5; --muted:#787c99; --code:#1f2335; --accent:#7aa2f7; --accent2:#bb9af7; --shadow:0 10px 30px rgba(0,0,0,.5); }
  body[data-pv="monokai"] { --bg:#1b1c18; --panel:#272822; --panel-solid:#34352d; --border:#49483e; --text:#f8f8f2; --muted:#a6a68a; --code:#34352d; --accent:#a6e22e; --accent2:#f92672; --shadow:0 10px 30px rgba(0,0,0,.5); }
  body[data-pv="bsw"] #preview h2 { color:#0a7fb0; } body[data-pv="bsw"] #preview h3 { color:#d5647a; } body[data-pv="bsw"] #preview h4 { color:#8a6397; } body[data-pv="bsw"] #preview h5 { color:#f29a3a; } body[data-pv="bsw"] #preview h6 { color:#3f9f90; }
  body[data-pv="bswdark"] #preview h2 { color:#4aa8d8; } body[data-pv="bswdark"] #preview h3 { color:#e0788f; } body[data-pv="bswdark"] #preview h4 { color:#b58ac4; } body[data-pv="bswdark"] #preview h5 { color:#f29a3a; } body[data-pv="bswdark"] #preview h6 { color:#5fc0ae; }
  body[data-pv="bsw"] #preview a { color:#5f277e; font-weight:600; } body[data-pv="bswdark"] #preview a { color:#b58ac4; font-weight:600; }
  body[data-pv="bsw"] #preview h1, body[data-pv="bswdark"] #preview h1 { background:none; -webkit-text-fill-color:currentColor; color:var(--text); letter-spacing:.01em; }
  body[data-pv="bsw"] #preview blockquote, body[data-pv="bswdark"] #preview blockquote { font-style:italic; }
  body[data-pv="bsw"] #preview h1, body[data-pv="github"] #preview h1, body[data-pv="paper"] #preview h1 { background:none; color:var(--text); -webkit-text-fill-color:var(--text); }
  body[data-pv] #preview { color:var(--text); }
  body[data-pv="plain"] { background:#fff; --bg:#ffffff; --panel:#ffffff; --panel-solid:#ffffff; --border:#e5e7eb; --text:#111827; --muted:#6b7280; --code:#f3f4f6; --accent:#374151; --accent2:#111827; --shadow:none; }
  body[data-pv="plain"] #preview h1, body[data-pv="plain"] #preview h2, body[data-pv="plain"] #preview h3, body[data-pv="plain"] #preview h4, body[data-pv="plain"] #preview h5, body[data-pv="plain"] #preview h6 { background:none; color:var(--text); -webkit-text-fill-color:var(--text); }
  body[data-pv="plain"] #preview a { color:#111827; text-decoration:underline; }
  body[data-pv="plain"] { --hl-kw:#111827; --hl-str:#4b5563; --hl-num:#4b5563; --hl-com:#9ca3af; --hl-fn:#111827; --hl-attr:#374151; --hl-var:#374151; }

  #pvMenu { position:absolute; left:calc(100% + 8px); width:190px; padding:8px; display:none; flex-direction:column; gap:2px; background:var(--panel-solid); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); }
  #pvMenu.open { display:flex; }

  #pvMenu button { display:flex; align-items:center; gap:10px; width:100%; padding:7px 8px; border:none; border-radius:9px; background:transparent; color:var(--text); font:inherit; font-size:13px; cursor:pointer; text-align:left; }
  #pvMenu { max-height:calc(100vh - 24px); overflow-y:auto; }

  @keyframes pulse { 50% { opacity:.55; } }

  #preview { will-change:scroll-position; flex:1; width:100%; min-width:0; box-sizing:border-box; padding:44px clamp(16px,4vw,48px) 48px; overflow-x:hidden; overflow-y:auto; overflow-wrap:anywhere; line-height:1.7; font-size:15.5px; animation:fade .4s ease; }

  .cz { position:relative; margin:22px 0; }
  .cz-track { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth; gap:0; border-radius:20px; border:1px solid rgba(128,128,128,.3); box-shadow:0 12px 40px rgba(0,0,0,.15); scrollbar-width:none; }

  #preview .cz-slide img { display:block; width:100%; height:auto; aspect-ratio:16/9; max-height:300px; object-fit:contain; margin:0; background:#f4f6fa; }

  /* Website welcome page: banner as the first slide; the other slides' images fill the same height */

  .cz-slide.cz-hero { background-color:transparent; }
  .cz-badge { transform:rotate(-10deg) scale(.75) !important; }
